<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiShock | Usage Rules</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #151515;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #ff4b2b;
            box-shadow: 0 0 20px rgba(255, 75, 43, 0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #ff4b2b; margin-bottom: 10px; }
        p { color: #bbb; line-height: 1.5; }
        .rules {
            text-align: left;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 0.9rem;
        }
        ul { padding-left: 20px; margin: 0; }
        li { margin-bottom: 8px; }
        .btn {
            display: block;
            background: #ff4b2b;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            background: #ff6a50;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚠️ WARNING</h1>
        <p>You are about to access my PiShock control panel. Please follow these rules:</p>
        
        <div class="rules">
            <ul>
                <li><strong>No Spamming:</strong> Wait 10s between zaps.</li>
                <li><strong>Max Intensity:</strong> Do not go over 30%.</li>
                <li><strong>Safe Word:</strong> If I say "Stop," you must stop.</li>
                <li><strong>Vibrate Only:</strong> If I am in a public setting.</li>
            </ul>
        </div>

        <a href="https://pishock.com/#/LinkControl?id=53a9dfa8-bbdf-4546-bdb0-4537237c7871" class="btn">I AGREE - ENTER PISHOCK</a>
    </div>

</body>
</html>
